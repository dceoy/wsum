[project]
name = "wsum"
version = "0.1.0"
description = "Simple website update monitoring skill"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.11, < 3.15"
dependencies = ["pypdf >= 6.15, < 7"]

[project.urls]
Repository = "https://github.com/dceoy/wsum.git"

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
  "ruff >= 0.15.18",
  "pyright >= 1.1.410",
  "pytest >= 9.1.1",
  "pytest-cov >= 7.1.0",
]

[tool.ruff]
line-length = 88
exclude = [".agents", ".claude", ".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
extraPaths = ["skills/web-update-monitor/scripts"]
exclude = [".agents", ".claude", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
