[project]
name = "wsum"
version = "0.1.0"
description = "Simple website update monitoring skill"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.11, < 3.15"
dependencies = ["pypdf >= 6.19, < 7"]

[project.urls]
Repository = "https://github.com/dceoy/wsum.git"

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
  "ruff >= 0.15.18",
  "pyright >= 1.1.410",
  "pytest >= 9.1.1",
  "pytest-cov >= 7.1.0",
]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv", ".agents", ".claude"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",  # flake8-copyright (CPY)
  "missing-trailing-comma",  # missing-trailing-comma
  "boolean-type-hint-positional-argument",  # boolean-type-hint-positional-argument
  "boolean-default-value-positional-argument",  # boolean-default-value-positional-argument
]

[tool.ruff.lint.per-file-ignores]
"skills/web-update-monitor/scripts/workspace.py" = [
  "complex-structure",  # explicit filesystem safety branches stay visible
  "docstring-missing-returns",  # concise helper docstrings are sufficient here
  "docstring-missing-exception",  # errors are represented by WorkspaceError messages
  "f-string-in-exception",  # CSV validation errors are intentionally contextual
  "implicit-namespace-package",  # skill scripts are executable helpers, not a package
  "print",  # CLI writes its JSON result to stdout/stderr
  "private-member-access",  # facade reuses monitor CLI defaults through its parser
  "raise-vanilla-args",  # WorkspaceError messages are defined at the decision site
  "raw-string-in-exception",  # CLI errors are intentionally direct literal messages
  "too-many-branches",  # local filesystem safety checks are intentionally explicit
  "too-many-return-statements",  # state outcomes map directly to returned actions
  "too-many-statements-in-try-clause",  # atomic pending writes stay in one transaction
]
"skills/web-update-monitor/scripts/monitor.py" = [
  "any-type",  # Any is required at urllib callback boundaries
  "blind-except",  # urllib exposes heterogeneous transport failures
  "docstring-missing-returns",  # concise helper docstrings are sufficient here
  "docstring-missing-exception",  # error details are represented by MonitorError messages
  "raw-string-in-exception",   # CLI errors are intentionally direct literal messages
  "implicit-namespace-package",  # skill scripts are executable helpers, not a Python package
  "magic-value-comparison", # protocol constants such as HTTP ports are self-explanatory
  "print",    # CLI writes its JSON result to stdout/stderr
]
"skills/web-update-monitor-llm-wiki/scripts/wiki.py" = [
  "docstring-missing-returns",  # concise helper docstrings are sufficient here
  "docstring-missing-exception",  # errors are represented by WikiError messages
  "f-string-in-exception",  # evidence and draft errors are intentionally contextual
  "implicit-namespace-package",  # skill scripts are executable helpers, not a package
  "magic-value-comparison",  # explicit size and count limits stay visible
  "raise-vanilla-args",  # WikiError messages are defined at the decision site
  "raw-string-in-exception",  # CLI errors are intentionally direct literal messages
  "too-many-locals",  # draft validation keeps related checks together
  "print",  # CLI writes its JSON result to stdout/stderr
]
"tests/**/*.py" = [
  "undocumented-public-function",    # test names describe their behavior
  "implicit-namespace-package",  # tests do not need to be a Python package
  "import-private-name", # private helper imports are intentional white-box tests
  "magic-value-comparison", # literal limits make compact tests easier to read
  "assert",    # assert is expected in pytest
  "private-member-access",  # private helper access is intentional in tests
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-public-methods = 40

[tool.pyright]
exclude = [
  "build",
  ".venv",
  ".agents",
  ".claude",
]
extraPaths = [
  "skills/web-update-monitor/scripts",
  "skills/web-update-monitor-llm-wiki/scripts",
]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = [
  "--cov=skills/web-update-monitor/scripts",
  "--cov=skills/web-update-monitor-llm-wiki/scripts",
  "--cov-branch",
  "--capture=no",
]
pythonpath = ["."]
testpaths = ["tests"]
python_functions = ["test_*"]

[tool.coverage.run]
source = [
  "skills/web-update-monitor/scripts",
  "skills/web-update-monitor-llm-wiki/scripts",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if TYPE_CHECKING:"]
