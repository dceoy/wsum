---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
  - package-ecosystem: pip
    directory: /skills/web-update-monitor
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      pip-dependencies:
        patterns:
          - '*'
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      uv-dependencies:
        patterns:
          - '*'
