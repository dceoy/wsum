name: Temporary GWS markdown format diagnostic

on:
  push:
    branches:
      - fix/gws-binary-transport-preflight

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          npx --yes prettier@3.9.6 --write skills/web-update-report-gws/SKILL.md
          git diff -- skills/web-update-report-gws/SKILL.md
