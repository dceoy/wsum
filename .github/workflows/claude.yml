---
name: Claude Code review and mention bot
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
    paths-ignore:
      - '.github/workflows/claude.yml'
  # The pinned callee checks commenter write access before its privileged job.
  issue_comment:  # zizmor: ignore[dangerous-triggers]
    types:
      - created
  pull_request_review_comment:
    types:
      - created
  issues:
    types:
      - opened
      - assigned
  pull_request_review:
    types:
      - submitted
permissions:
  contents: read
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
      && (! github.event.pull_request.draft)
      && github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: dceoy/pr-loop/.github/workflows/claude-code-review.yml@main  # zizmor: ignore[unpinned-uses]
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # zizmor: ignore[secrets-outside-env]
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  claude-code-bot:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      || (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: dceoy/gha-for-devops/.github/workflows/claude-code-bot.yml@5ddf8e955c0595f63f82603d47478299044b8af3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # zizmor: ignore[secrets-outside-env]
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
