---
name: Package agent skills
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'release'
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/agent-skills-package.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
  package-release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/agent-skills-package.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
